# Cogtive Industrial IoT Platform - Docker Compose Configuration
# This docker-compose file sets up the entire development environment for the Cogtive technical challenge

version: '3.8'

services:
  postgres:
    image: postgres:16
    environment:
      - POSTGRES_DB=cogtive
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cogtive-network

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - DatabaseProvider=Postgres
      - ConnectionStrings__PostgresConnection=Host=postgres;Database=cogtive;Username=postgres;Password=postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cogtive-network

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - api
    networks:
      - cogtive-network

  iot-simulator:
    build:
      context: ./iot-simulator
      dockerfile: Dockerfile
    environment:
      - API_ENDPOINT=http://api:8080/api/production-data
    depends_on:
      - api
    networks:
      - cogtive-network

volumes:
  postgres_data:

networks:
  cogtive-network:
    driver: bridge
